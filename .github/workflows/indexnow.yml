# Avisa o Bing (IndexNow) das páginas que mudaram em cada push para main.
# Espera o deploy da Vercel subir antes de avisar. Ver scripts/indexnow.ts.
name: IndexNow
on:
  push:
    branches: [main]
  # Rodar à mão: avisa tudo o que mudou entre dois commits (sem esperar deploy).
  workflow_dispatch:
    inputs:
      antes:
        description: Commit de main antes das mudanças
        required: true
      depois:
        description: Commit de main depois (padrão, o atual)
        required: false
        default: HEAD
permissions:
  contents: read
concurrency:
  group: indexnow
  cancel-in-progress: false
jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Esperar o deploy da Vercel
        if: github.event_name == 'push'
        run: sleep 300
      - name: Avisar o Bing (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npx --yes tsx scripts/indexnow.ts "${{ github.event.before }}" "${{ github.sha }}"
      - name: Avisar o Bing (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTES: ${{ inputs.antes }}
          DEPOIS: ${{ inputs.depois }}
        run: npx --yes tsx scripts/indexnow.ts "$ANTES" "$DEPOIS"
