<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Cross over com halteres em 4 passos">
  <title>Cross over com halteres em 4 passos</title>
  <desc>Os 4 passos do cross over com halteres - Montinho Personal Trainer</desc>
  <rect width="1200" height="630" fill="#0d0d0d"/>
  <rect x="0" y="0" width="5" height="630" fill="#BA9E50"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#BA9E50" stroke-width="1" opacity="0.3"/>
  <rect x="25" y="22" width="150" height="28" rx="12" fill="#BA9E50" fill-opacity="0.15" stroke="#BA9E50" stroke-width="1" opacity="0.6"/>
  <text x="100" y="41" font-family="Arial,sans-serif" font-size="13" fill="#BA9E50" text-anchor="middle" font-weight="600">Treinamento</text>
  <text x="600" y="110" font-family="Arial,sans-serif" font-size="30" fill="#F5F5F5" text-anchor="middle" font-weight="bold">Cross over com halteres em 4 passos</text>
  <line x1="80" y1="145" x2="1120" y2="145" stroke="#BA9E50" stroke-width="1" opacity="0.4"/>
  <circle cx="90" cy="205" r="6" fill="#BA9E50" fill-opacity="0.8"/>
  <text x="115" y="210" font-family="Arial,sans-serif" font-size="22" fill="#F5F5F5">1. Banco a 30 graus ou em pé com o tronco inclinado, cotovelos levemente dobrados</text>
  <circle cx="90" cy="285" r="6" fill="#BA9E50" fill-opacity="0.8"/>
  <text x="115" y="290" font-family="Arial,sans-serif" font-size="22" fill="#F5F5F5">2. Abra em arco ate a linha dos ombros, sem passar dela</text>
  <circle cx="90" cy="365" r="6" fill="#BA9E50" fill-opacity="0.8"/>
  <text x="115" y="370" font-family="Arial,sans-serif" font-size="22" fill="#F5F5F5">3. Feche em arco a frente do peito, quem trabalha e o peito</text>
  <circle cx="90" cy="445" r="6" fill="#BA9E50" fill-opacity="0.8"/>
  <text x="115" y="450" font-family="Arial,sans-serif" font-size="22" fill="#F5F5F5">4. Dois segundos abrindo, um fechando, pausa curta no fim</text>
  <text x="1170" y="605" font-family="Arial,sans-serif" font-size="13" fill="#BA9E50" text-anchor="end" opacity="0.7">montinhopersonal.com.br</text>
</svg>
