  <text x="1100" y="228" font-family="Arial,sans-serif" font-size="17" fill="#9a9a9a" text-anchor="end">referência</text>
  <text x="80" y="288" font-family="Arial,sans-serif" font-size="19" fill="#F5F5F5" font-weight="bold">90 a 120 min</text>
