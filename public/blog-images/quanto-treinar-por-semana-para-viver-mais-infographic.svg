  <text x="1000" y="348" font-family="Arial,sans-serif" font-size="17" fill="#F5F5F5" text-anchor="end">sem ganho adicional</text>
  <text x="80" y="408" font-family="Arial,sans-serif" font-size="19" fill="#F5F5F5" font-weight="bold">90 a 120 min + aeróbico</text>
