<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Polichinelo queima quantas calorias?">
  <title>Polichinelo queima quantas calorias?</title>
  <desc>Tabela de calorias do polichinelo por quantidade e por peso - Montinho Personal Trainer</desc>
  <rect width="1200" height="630" fill="#0d0d0d"/>
  <rect x="0" y="0" width="5" height="630" fill="#BA9E50"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#BA9E50" stroke-width="1" opacity="0.3"/>
  <rect x="25" y="22" width="150" height="28" rx="12" fill="#BA9E50" fill-opacity="0.15" stroke="#BA9E50" stroke-width="1" opacity="0.6"/>
  <text x="100" y="41" font-family="Arial,sans-serif" font-size="13" fill="#BA9E50" text-anchor="middle" font-weight="600">Emagrecimento</text>
  <text x="600" y="110" font-family="Arial,sans-serif" font-size="30" fill="#F5F5F5" text-anchor="middle" font-weight="bold">Polichinelo queima quantas calorias?</text>
  <line x1="80" y1="145" x2="1120" y2="145" stroke="#BA9E50" stroke-width="1" opacity="0.4"/>
  <circle cx="90" cy="205" r="6" fill="#BA9E50" fill-opacity="0.8"/>
  <text x="115" y="210" font-family="Arial,sans-serif" font-size="22" fill="#F5F5F5">1 minuto: cerca de 10 kcal (70 kg)</text>
  <circle cx="90" cy="285" r="6" fill="#BA9E50" fill-opacity="0.8"/>
  <text x="115" y="290" font-family="Arial,sans-serif" font-size="22" fill="#F5F5F5">100 polichinelos: 15 a 25 kcal (de 60 a 100 kg)</text>
  <circle cx="90" cy="365" r="6" fill="#BA9E50" fill-opacity="0.8"/>
  <text x="115" y="370" font-family="Arial,sans-serif" font-size="22" fill="#F5F5F5">500 polichinelos: 76 a 127 kcal, em 9 a 10 minutos</text>
  <circle cx="90" cy="445" r="6" fill="#BA9E50" fill-opacity="0.8"/>
  <text x="115" y="450" font-family="Arial,sans-serif" font-size="22" fill="#F5F5F5">1.000 polichinelos: 153 a 255 kcal</text>
  <circle cx="90" cy="525" r="6" fill="#BA9E50" fill-opacity="0.8"/>
  <text x="115" y="530" font-family="Arial,sans-serif" font-size="22" fill="#F5F5F5">30 min de caminhada = cerca de 700 polichinelos</text>
  <text x="1170" y="605" font-family="Arial,sans-serif" font-size="13" fill="#BA9E50" text-anchor="end" opacity="0.7">montinhopersonal.com.br</text>
</svg>
