<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Primeira sessão com personal trainer: o roteiro">
  <title>Primeira sessão com personal trainer: o roteiro</title>
  <desc>As quatro partes da primeira sessão e quanto tempo cada uma leva - Montinho Personal Trainer</desc>
  <rect width="1200" height="630" fill="#0d0d0d"/>
  <rect x="0" y="0" width="5" height="630" fill="#BA9E50"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#BA9E50" stroke-width="1" opacity="0.3"/>
  <rect x="25" y="22" width="160" height="28" rx="12" fill="#BA9E50" fill-opacity="0.15" stroke="#BA9E50" stroke-width="1" opacity="0.6"/>
  <text x="105" y="41" font-family="Arial,sans-serif" font-size="13" fill="#BA9E50" text-anchor="middle" font-weight="600">Personal Trainer</text>
  <text x="600" y="100" font-family="Arial,sans-serif" font-size="30" fill="#F5F5F5" text-anchor="middle" font-weight="bold">Primeira sessão com personal: o que acontece, em ordem</text>
  <line x1="80" y1="130" x2="1120" y2="130" stroke="#BA9E50" stroke-width="1" opacity="0.4"/>
  <line x1="120" y1="185" x2="120" y2="500" stroke="#BA9E50" stroke-width="2" opacity="0.4"/>
  <circle cx="120" cy="190" r="16" fill="#BA9E50"/>
  <text x="120" y="196" font-family="Arial,sans-serif" font-size="16" fill="#0d0d0d" text-anchor="middle" font-weight="bold">1</text>
  <text x="160" y="186" font-family="Arial,sans-serif" font-size="23" fill="#F5F5F5" font-weight="bold">Conversa</text>
  <text x="160" y="212" font-family="Arial,sans-serif" font-size="17" fill="#9a9a9a">20 a 30 min · histórico, lesões, rotina, o que você quer de verdade</text>
  <circle cx="120" cy="280" r="16" fill="#BA9E50"/>
  <text x="120" y="286" font-family="Arial,sans-serif" font-size="16" fill="#0d0d0d" text-anchor="middle" font-weight="bold">2</text>
  <text x="160" y="276" font-family="Arial,sans-serif" font-size="23" fill="#F5F5F5" font-weight="bold">Avaliação</text>
  <text x="160" y="302" font-family="Arial,sans-serif" font-size="17" fill="#9a9a9a">15 a 20 min · peso, medidas, pressão, testes simples de força e mobilidade</text>
  <circle cx="120" cy="370" r="16" fill="#BA9E50"/>
  <text x="120" y="376" font-family="Arial,sans-serif" font-size="16" fill="#0d0d0d" text-anchor="middle" font-weight="bold">3</text>
  <text x="160" y="366" font-family="Arial,sans-serif" font-size="23" fill="#F5F5F5" font-weight="bold">Teste de movimento</text>
  <text x="160" y="392" font-family="Arial,sans-serif" font-size="17" fill="#9a9a9a">10 a 15 min · agachar, empurrar, puxar e dobrar o quadril, sem carga</text>
  <circle cx="120" cy="460" r="16" fill="#BA9E50"/>
  <text x="120" y="466" font-family="Arial,sans-serif" font-size="16" fill="#0d0d0d" text-anchor="middle" font-weight="bold">4</text>
  <text x="160" y="456" font-family="Arial,sans-serif" font-size="23" fill="#F5F5F5" font-weight="bold">Treino leve</text>
  <text x="160" y="482" font-family="Arial,sans-serif" font-size="17" fill="#9a9a9a">20 a 30 min · carga baixa, longe da falha, para o personal ver como você reage</text>
  <rect x="80" y="530" width="1040" height="46" rx="6" fill="#BA9E50" fill-opacity="0.12" stroke="#BA9E50" stroke-width="1" opacity="0.7"/>
  <text x="600" y="559" font-family="Arial,sans-serif" font-size="18" fill="#F5F5F5" text-anchor="middle">Total: 60 a 90 minutos · o plano chega em 1 ou 2 dias, montado com o que ele viu · você não sai sem conseguir andar</text>
  <text x="1170" y="605" font-family="Arial,sans-serif" font-size="13" fill="#BA9E50" text-anchor="end" opacity="0.7">montinhopersonal.com.br</text>
</svg>
